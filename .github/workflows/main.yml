name: Build mod jar
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: pearltrajectory-jar
          path: build/libs/*.jar
